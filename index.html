<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Intelligence Hub | Advanced Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .slicer-btn.active { background-color: #3b82f6; color: white; border-color: #60a5fa; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 flex flex-col border-r border-slate-800 p-6 space-y-8 bg-slate-900">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-blue-500">INSIGHT.AI</h1>
            <p class="text-[10px] font-bold text-slate-500 tracking-[0.3em] uppercase">Advanced Analytics</p>
        </div>

        <div id="slicerSection" class="space-y-6 hidden">
            <div>
                <label class="text-[11px] font-black text-slate-500 uppercase mb-3 block">Lokasyon Filtresi</label>
                <div id="locSlicer" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
                <label class="text-[11px] font-black text-slate-500 uppercase mb-3 block">Takım Filtresi</label>
                <div id="teamSlicer" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2"></div>
            </div>
            <div>
                <label class="text-[11px] font-black text-slate-500 uppercase mb-3 block">Dinleme Tipi</label>
                <div id="typeSlicer" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <div class="mt-auto">
            <input type="file" id="fileInput" class="hidden" accept=".xlsx, .csv">
            <button onclick="document.getElementById('fileInput').click()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold shadow-xl shadow-blue-900/20 transition-all flex items-center justify-center space-x-2">
                <span>📂</span> <span>VERİ KAYNAĞI YÜKLE</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 flex items-center justify-between px-10 border-b border-slate-800">
            <div id="activeFilters" class="flex space-x-2 italic text-sm text-slate-400">
                Lütfen analiz için dosya yükleyin...
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p id="totalRowsDisplay" class="text-xs font-bold text-slate-500">0 KAYIT</p>
                    <p class="text-[10px] text-blue-400 font-black">CANLI ANALİZ MODU</p>
                </div>
            </div>
        </header>

        <div id="dashboard" class="flex-1 overflow-y-auto p-10 space-y-8 opacity-20 pointer-events-none transition-all duration-700">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="glass-card p-6 rounded-[2rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Genel Skor</p>
                    <h2 id="mainScore" class="text-5xl font-black text-white">%0</h2>
                </div>
                <div class="glass-card p-6 rounded-[2rem] border-l-4 border-l-red-500">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Kritik Hata Tespiti</p>
                    <h2 id="criticalCount" class="text-5xl font-black text-white">0</h2>
                </div>
                <div class="glass-card p-6 rounded-[2rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Kalite Ortalaması</p>
                    <h2 id="qualAvg" class="text-3xl font-black text-blue-400">%0</h2>
                </div>
                <div class="glass-card p-6 rounded-[2rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">TL Dinleme Ort.</p>
                    <h2 id="tlAvg" class="text-3xl font-black text-indigo-400">%0</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 glass-card p-8 rounded-[2.5rem]">
                    <h3 class="font-bold text-slate-300 mb-6 flex items-center">📈 Zaman Bazlı Performans Trendi</h3>
                    <canvas id="trendChart" height="120"></canvas>
                </div>
                <div class="glass-card p-8 rounded-[2.5rem]">
                    <h3 class="font-bold text-slate-300 mb-6">🚫 En Çok Tespit Edilen Hatalar</h3>
                    <div id="errorAnalysis" class="space-y-4"></div>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem]">
                <h3 class="font-bold text-slate-300 mb-6">👥 Takım & Performans Karşılaştırması</h3>
                <canvas id="teamBarChart" height="80"></canvas>
            </div>
        </div>
    </main>

    <script>
        let rawData = [];
        let filteredData = [];
        let charts = {};
        let activeFilters = { loc: null, team: null, type: null };

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                initDashboard();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function initDashboard() {
            document.getElementById('dashboard').style.opacity = "1";
            document.getElementById('dashboard').style.pointerEvents = "auto";
            document.getElementById('slicerSection').classList.remove('hidden');
            
            createSlicers();
            applyFilters();
        }

        function createSlicers() {
            const locs = [...new Set(rawData.map(d => d["Grup Adı"]))].filter(Boolean);
            const teams = [...new Set(rawData.map(d => d["Takım Adı"]))].filter(Boolean);
            const types = [...new Set(rawData.map(d => d["Dinleyen Tipi"]))].filter(Boolean);

            renderSlicer('locSlicer', locs, 'loc');
            renderSlicer('teamSlicer', teams, 'team');
            renderSlicer('typeSlicer', types, 'type');
        }

        function renderSlicer(id, items, filterKey) {
            const container = document.getElementById(id);
            container.innerHTML = `<button class="slicer-btn px-3 py-1 text-[10px] font-bold border border-slate-700 rounded-lg transition active shadow-sm" onclick="setFilter('${filterKey}', null)">HEPSİ</button>`;
            items.forEach(item => {
                container.innerHTML += `<button class="slicer-btn px-3 py-1 text-[10px] font-bold border border-slate-700 rounded-lg transition shadow-sm" onclick="setFilter('${filterKey}', '${item}')">${item}</button>`;
            });
        }

        window.setFilter = (key, val) => {
            activeFilters[key] = val;
            applyFilters();
            
            // UI Button Active State
            const container = document.querySelector(`[onclick*="${key}"]`).parentElement;
            container.querySelectorAll('.slicer-btn').forEach(btn => {
                btn.classList.remove('active');
                if((val === null && btn.innerText === "HEPSİ") || btn.innerText === val) btn.classList.add('active');
            });
        };

        function applyFilters() {
            filteredData = rawData.filter(d => {
                return (!activeFilters.loc || d["Grup Adı"] === activeFilters.loc) &&
                       (!activeFilters.team || d["Takım Adı"] === activeFilters.team) &&
                       (!activeFilters.type || d["Dinleyen Tipi"] === activeFilters.type);
            });

            updateUI();
        }

        function updateUI() {
            document.getElementById('totalRowsDisplay').innerText = filteredData.length + " KAYIT";
            
            // KPI Calculations
            const avgScore = Math.round(filteredData.reduce((acc, d) => acc + (parseFloat(d["Form Puan"]) || 0), 0) / filteredData.length);
            const criticals = filteredData.filter(d => (parseFloat(d["Form Puan"]) || 0) < 80).length;
            
            const kalData = filteredData.filter(d => d["Dinleyen Tipi"] === "Kalite");
            const tlData = filteredData.filter(d => d["Dinleyen Tipi"] === "Takım Lideri");
            
            const kalAvg = Math.round(kalData.reduce((acc, d) => acc + (parseFloat(d["Form Puan"]) || 0), 0) / (kalData.length || 1));
            const tlAvg = Math.round(tlData.reduce((acc, d) => acc + (parseFloat(d["Form Puan"]) || 0), 0) / (tlData.length || 1));

            document.getElementById('mainScore').innerText = "%" + avgScore;
            document.getElementById('criticalCount').innerText = criticals;
            document.getElementById('qualAvg').innerText = "%" + kalAvg;
            document.getElementById('tlAvg').innerText = "%" + tlAvg;

            renderCharts();
            analyzeErrorText();
        }

        function analyzeErrorText() {
            const errorKeywords = {
                "Bilgilendirme": ["bilgi", "hatalı", "eksik"],
                "Üslup/Nezaket": ["üslup", "nezaket", "günlük", "senli"],
                "Kapanış Hatası": ["kapanış", "vedalaşma"],
                "Sistem/Kayıt": ["not", "sistem", "kayıt"],
                "Dinleme/Anlama": ["anlama", "dinleme", "söz kesme"]
            };

            const counts = {};
            filteredData.filter(d => (parseFloat(d["Form Puan"]) || 0) < 100).forEach(d => {
                const desc = (d["Açıklama Detay"] || "").toLowerCase();
                for (let key in errorKeywords) {
                    if (errorKeywords[key].some(word => desc.includes(word))) {
                        counts[key] = (counts[key] || 0) + 1;
                    }
                }
            });

            const sortedErrors = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            document.getElementById('errorAnalysis').innerHTML = sortedErrors.map(([name, count]) => `
                <div class="flex justify-between items-center p-4 bg-slate-800/50 rounded-2xl border border-slate-700/50">
                    <span class="text-xs font-semibold text-slate-300">${name}</span>
                    <span class="text-red-400 font-black text-xs">${count} Tespit</span>
                </div>
            `).join('') || '<p class="text-xs text-slate-500 italic">Hata tespit edilmedi.</p>';
        }

        function renderCharts() {
            // Trend Chart
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            if(charts.trend) charts.trend.destroy();
            
            // Tarih bazlı gruplama (Basit sıralama)
            const trendData = filteredData.slice(-15).map(d => ({t: d["Tarih"], v: d["Form Puan"]}));

            charts.trend = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: trendData.map(d => d.t),
                    datasets: [{
                        label: 'Skor Trendi',
                        data: trendData.map(d => d.v),
                        borderColor: '#3b82f6',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(59, 130, 246, 0.1)'
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, max: 100 } } }
            });

            // Team Bar Chart
            const teamCtx = document.getElementById('teamBarChart').getContext('2d');
            if(charts.team) charts.team.destroy();
            
            const teamGroups = {};
            filteredData.forEach(d => {
                if(!teamGroups[d["Takım Adı"]]) teamGroups[d["Takım Adı"]] = {s: 0, c: 0};
                teamGroups[d["Takım Adı"]].s += parseFloat(d["Form Puan"]) || 0;
                teamGroups[d["Takım Adı"]].c++;
            });

            charts.team = new Chart(teamCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(teamGroups),
                    datasets: [{
                        data: Object.values(teamGroups).map(g => Math.round(g.s/g.c)),
                        backgroundColor: '#6366f1',
                        borderRadius: 15
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESTEL ANALİZ | Profesyonel Karar Destek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .active-slicer { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        /* Mobil Kaydırma */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .mobile-card { min-width: 280px; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; position: fixed; z-index: 50; }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <div class="md:hidden flex items-center justify-between p-4 bg-slate-950 border-b border-slate-800">
        <h1 class="text-xl font-black text-blue-500">ESTEL ANALİZ</h1>
        <button onclick="toggleSidebar()" class="p-2 text-slate-400">☰</button>
    </div>

    <aside id="sidebar" class="sidebar w-80 h-full bg-slate-950 border-r border-slate-900 p-6 flex flex-col space-y-6 overflow-y-auto">
        <div>
            <h1 class="hidden md:block text-2xl font-black text-blue-500 mb-1">ESTEL ANALİZ</h1>
            <p class="text-[9px] font-bold text-slate-600 tracking-widest uppercase">Kurumsal Analitik Terminali</p>
        </div>

        <div class="space-y-3">
            <label class="text-[10px] font-black text-slate-500 uppercase">📊 Veri Bağlantısı</label>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setSource('excel')" id="btnExcel" class="p-3 text-[10px] font-bold rounded-xl border border-slate-800 bg-slate-900 active-slicer">EXCEL YÜKLE</button>
                <button onclick="setSource('sql')" id="btnSql" class="p-3 text-[10px] font-bold rounded-xl border border-slate-800 bg-slate-900">SQL SERVER</button>
            </div>
        </div>

        <div id="sqlMenu" class="hidden p-4 rounded-xl bg-black border border-blue-900/30 space-y-3">
            <p class="text-[9px] font-bold text-blue-400">SQL CONNECTION MANAGER</p>
            <input type="text" placeholder="Server IP/Name" class="w-full bg-slate-900 border border-slate-800 p-2 rounded text-[10px]" value="192.168.1.100">
            <button onclick="simulateSqlConnect()" class="w-full bg-blue-600 text-[10px] font-bold py-2 rounded">BAĞLAN (CONNECT)</button>
        </div>

        <div id="filterSection" class="flex-1 space-y-6 pt-4">
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase mb-3 block">Lokasyon / Grup</label>
                <div id="locSlicer" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase mb-3 block">Takım Listesi</label>
                <div id="teamSlicer" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <div id="excelUploadArea" class="pt-6">
            <input type="file" id="fileInput" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="w-full bg-slate-800 py-3 rounded-xl text-xs font-bold">📂 Dosya Seç</button>
        </div>

        <button onclick="exportData()" class="w-full bg-green-700 py-3 rounded-xl text-xs font-bold mt-2">📥 Sonuçları Excel'e Dök</button>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-10 space-y-6 no-scrollbar">
        
        <div class="flex overflow-x-auto gap-4 pb-4 no-scrollbar">
            <div class="glass p-6 rounded-3xl min-w-[240px] flex-1">
                <p class="text-slate-500 text-[10px] font-bold uppercase">Genel Başarı</p>
                <h3 id="kpiScore" class="text-3xl font-black text-white">%0</h3>
            </div>
            <div class="glass p-6 rounded-3xl min-w-[240px] flex-1 border-l-4 border-red-600">
                <p class="text-slate-500 text-[10px] font-bold uppercase">En Düşük MT Puanı</p>
                <h3 id="kpiMin" class="text-3xl font-black text-red-500">%0</h3>
            </div>
            <div class="glass p-6 rounded-3xl min-w-[240px] flex-1">
                <p class="text-slate-500 text-[10px] font-bold uppercase">En Çok Hata</p>
                <h3 id="kpiTopError" class="text-xl font-black text-blue-400">...</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-[2rem]">
                <h4 class="text-xs font-bold text-slate-400 mb-4 uppercase">Performans Trendi</h4>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="glass p-6 rounded-[2rem]">
                <h4 class="text-xs font-bold text-slate-400 mb-4 uppercase">Takım Karşılaştırma</h4>
                <canvas id="teamChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-8 rounded-[2rem]">
                <h4 class="text-xs font-bold text-slate-400 mb-6 uppercase">En İyi 5 Performans (MT)</h4>
                <div id="topPerformers" class="space-y-3"></div>
            </div>
            <div class="glass p-8 rounded-[2rem]">
                <h4 class="text-xs font-bold text-slate-400 mb-6 uppercase">Hata Kök Neden Dağılımı</h4>
                <div id="errorDetails" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        let rawData = [], charts = {}, currentSource = 'excel', filters = { loc: null, team: null };

        // MOBİL SIDEBAR KONTROL
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        // KAYNAK SEÇİMİ (EXCEL / SQL)
        function setSource(type) {
            currentSource = type;
            document.getElementById('btnExcel').classList.toggle('active-slicer', type === 'excel');
            document.getElementById('btnSql').classList.toggle('active-slicer', type === 'sql');
            document.getElementById('sqlMenu').classList.toggle('hidden', type !== 'sql');
            document.getElementById('excelUploadArea').classList.toggle('hidden', type !== 'excel');
        }

        // SQL SİMÜLASYONU
        function simulateSqlConnect() {
            alert("SQL Veritabanına bağlanılıyor... (Simülasyon)");
            // Burada gerçek bir fetch('') ile SQL verisi çekilebilir
            alert("Bağlantı Başarılı! Veriler SQL üzerinden çekildi.");
        }

        // DOSYA OKUMA
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
                rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(d => ({
                    ...d,
                    "P": parseFloat(d["Form Puan"]) || 0,
                    "T": d["Takım Adı"] || d["Vardiya"] || "Diğer",
                    "L": d["Grup Adı"] || d["Lokasyon"] || "Genel",
                    "MT": d["Müşteri Temsilcisi"] || d["Personel"] || d["MT Adı"] || "İsimsiz"
                }));
                initSlicers();
                updateDashboard();
                if(window.innerWidth < 768) toggleSidebar();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function initSlicers() {
            const locs = [...new Set(rawData.map(d => d.L))].sort();
            const teams = [...new Set(rawData.map(d => d.T))].sort();
            renderSlicer('locSlicer', locs, 'loc');
            renderSlicer('teamSlicer', teams, 'team');
        }

        function renderSlicer(id, items, key) {
            const el = document.getElementById(id);
            el.innerHTML = `<button onclick="setFilter('${key}', null)" class="px-3 py-1 text-[9px] font-bold border border-slate-800 rounded-lg bg-slate-900 ${!filters[key]?'active-slicer':''}">HEPSİ</button>`;
            items.forEach(i => {
                el.innerHTML += `<button onclick="setFilter('${key}', '${i}')" class="px-3 py-1 text-[9px] font-bold border border-slate-800 rounded-lg bg-slate-900 ${filters[key]===i?'active-slicer':''}">$ {i}</button>`;
            });
        }

        window.setFilter = (key, val) => { filters[key] = val; updateDashboard(); initSlicers(); };

        function updateDashboard() {
            const data = rawData.filter(d => (!filters.loc || d.L === filters.loc) && (!filters.team || d.T === filters.team));
            if(!data.length) return;

            const scores = data.map(d => d.P);
            const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
            
            document.getElementById('kpiScore').innerText = "%" + avg;
            document.getElementById('kpiMin').innerText = "%" + Math.min(...scores);
            
            renderTopPerformers(data);
            renderErrorAnalysis(data);
            renderCharts(data);
        }

        function renderTopPerformers(data) {
            const top5 = [...data].sort((a,b) => b.P - a.P).slice(0, 5);
            document.getElementById('topPerformers').innerHTML = top5.map(m => `
                <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-xl border border-slate-800">
                    <span class="text-[11px] font-bold">${m.MT} <br><small class="text-slate-500">${m.T}</small></span>
                    <span class="text-xs font-black text-green-400">%${m.P}</span>
                </div>
            `).join('');
        }

        function renderErrorAnalysis(data) {
            const keywords = {"Bilgi Eksikliği": ["bilgi", "eksik"], "İletişim": ["üslup", "nezaket"], "Süreç": ["not", "prosedür"]};
            const counts = {};
            data.forEach(d => {
                const txt = (d["Açıklama Detay"] || "").toLowerCase();
                for(let k in keywords) if(keywords[k].some(w => txt.includes(w))) counts[k] = (counts[k] || 0) + 1;
            });

            document.getElementById('errorDetails').innerHTML = Object.entries(counts).map(([k,v]) => `
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] font-bold uppercase"><span class="text-slate-400">${k}</span><span class="text-red-500">${v} Adet</span></div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden"><div class="bg-blue-600 h-full" style="width:${(v/data.length)*100}%"></div></div>
                </div>
            `).join('');
            
            const maxError = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
            document.getElementById('kpiTopError').innerText = maxError ? maxError[0] : "Temiz";
        }

        function renderCharts(data) {
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            if(charts.trend) charts.trend.destroy();
            charts.trend = new Chart(trendCtx, {
                type: 'line',
                data: { labels: data.slice(-10).map(d => d["Tarih"]), datasets: [{ label: 'Skor', data: data.slice(-10).map(d => d.P), borderColor: '#3b82f6', tension: 0.3 }] },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            const teamCtx = document.getElementById('teamChart').getContext('2d');
            if(charts.team) charts.team.destroy();
            const groups = {};
            data.forEach(d => { if(!groups[d.T]) groups[d.T] = {s:0, c:0}; groups[d.T].s += d.P; groups[d.T].c++; });
            charts.team = new Chart(teamCtx, {
                type: 'bar',
                data: { labels: Object.keys(groups), datasets: [{ data: Object.values(groups).map(g => g.s/g.c), backgroundColor: '#6366f1', borderRadius: 8 }] },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        function exportData() {
            if(!rawData.length) return;
            const ws = XLSX.utils.json_to_sheet(rawData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Analiz");
            XLSX.writeFile(wb, "ESTEL_Analiz_Ciktisi.xlsx");
        }
    </script>
</body>
</html>

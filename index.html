<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Based Excel Analyzer</title>
    <!-- Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .dashboard-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #drop-zone { border: 2px dashed #007bff; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        #drop-zone:hover { background: #e7f1ff; }
        .table-container { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold">Excel Insight Engine</h1>
        <p class="text-muted">Dosyanızı sürükleyin, anında analiz edin.</p>
    </header>

    <div class="dashboard-card" id="drop-zone">
        <input type="file" id="fileInput" hidden accept=".xlsx, .xls, .csv">
        <p class="m-0">Excel dosyasını buraya bırakın veya <strong>tıklayın</strong></p>
    </div>

    <div id="analysisArea" style="display: none;">
        <div class="row">
            <!-- Özet İstatistikler -->
            <div class="col-md-4">
                <div class="dashboard-card h-100">
                    <h5>Veri Özeti</h5>
                    <div id="statsBox"></div>
                </div>
            </div>
            <!-- Grafik Alanı -->
            <div class="col-md-8">
                <div class="dashboard-card">
                    <h5>Görselleştirme</h5>
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tablo Görünümü -->
        <div class="dashboard-card">
            <h5>Veri Önizleme</h5>
            <div class="table-container" id="tableBox"></div>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('fileInput');
    let chartInstance = null;

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            
            processData(jsonData);
        };
        reader.readAsArrayBuffer(file);
    }

    function processData(data) {
        document.getElementById('analysisArea').style.display = 'block';
        
        // 1. Tabloyu Oluştur
        renderTable(data);
        
        // 2. Sayısal Analiz
        const keys = Object.keys(data[0]);
        const numericKeys = keys.filter(key => typeof data[0][key] === 'number');
        const labels = data.map(row => row[keys[0]]); // Genelde ilk kolon etiket olur

        if (numericKeys.length > 0) {
            updateChart(labels, data.map(row => row[numericKeys[0]]), numericKeys[0]);
            renderStats(data, numericKeys);
        }
    }

    function renderTable(data) {
        let html = '<table class="table table-sm table-striped"><thead><tr>';
        Object.keys(data[0]).forEach(k => html += `<th>${k}</th>`);
        html += '</tr></thead><tbody>';
        data.slice(0, 50).forEach(row => {
            html += '<tr>';
            Object.values(row).forEach(v => html += `<td>${v}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('tableBox').innerHTML = html;
    }

    function renderStats(data, keys) {
        let html = '<ul class="list-group list-group-flush">';
        keys.forEach(key => {
            const values = data.map(r => r[key]).filter(v => !isNaN(v));
            const sum = values.reduce((a, b) => a + b, 0);
            const avg = (sum / values.length).toFixed(2);
            html += `<li class="list-group-item">
                <strong>${key}</strong><br>
                Toplam: ${sum.toLocaleString()} | Ort: ${avg}
            </li>`;
        });
        html += '</ul>';
        document.getElementById('statsBox').innerHTML = html;
    }

    function updateChart(labels, values, label) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels.slice(0, 20), // İlk 20 kayıt
                datasets: [{
                    label: label,
                    data: values.slice(0, 20),
                    backgroundColor: '#007bff'
                }]
            },
            options: { responsive: true }
        });
    }
</script>

</body>
</html>

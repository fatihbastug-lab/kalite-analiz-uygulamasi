<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTEL ANALİZ | Veri Analitik Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #e2e8f0; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.03); }
        .slicer-btn.active { background-color: #2563eb; color: white; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 flex flex-col border-r border-slate-900 p-6 space-y-8 bg-[#080b14]">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tighter bg-gradient-to-r from-blue-500 to-indigo-400 bg-clip-text text-transparent">ESTEL</h1>
            <p class="text-[10px] font-bold text-slate-600 tracking-[0.4em] uppercase">Analiz Paneli</p>
        </div>

        <div id="slicerSection" class="space-y-6 hidden flex-1 overflow-y-auto">
            <div>
                <label class="text-[10px] font-black text-slate-700 uppercase mb-3 block">Lokasyon / Grup</label>
                <div id="locSlicer" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-700 uppercase mb-3 block">Takım Filtresi</label>
                <div id="teamSlicer" class="flex flex-wrap gap-2 max-h-64 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <div class="mt-auto space-y-4">
            <input type="file" id="fileInput" class="hidden" accept=".xlsx, .csv">
            <button onclick="document.getElementById('fileInput').click()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center space-x-2">
                <span>📂</span> <span>ANALİZ DOSYASI YÜKLE</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 flex items-center justify-between px-10 border-b border-slate-900 bg-slate-950/30">
            <div id="statusInfo" class="text-xs text-slate-500 font-medium">Veri yüklenmesi bekleniyor...</div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p class="text-xs font-bold text-slate-400">Yönetici Paneli</p>
                    <p class="text-[9px] text-blue-500 font-black tracking-widest uppercase">Canlı Veri Modu</p>
                </div>
            </div>
        </header>

        <div id="dashboard" class="flex-1 overflow-y-auto p-10 space-y-8 opacity-10 transition-all duration-700">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 rounded-[2rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Genel Başarı Ortalaması</p>
                    <h2 id="kpiScore" class="text-5xl font-black text-white">%0</h2>
                </div>
                <div class="glass-card p-6 rounded-[2rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Toplam Değerlendirme</p>
                    <h2 id="kpiTotal" class="text-5xl font-black text-blue-400">0</h2>
                </div>
                <div class="glass-card p-6 rounded-[2rem] border-l-4 border-l-red-600">
                    <p class="text-slate-500 text-[10px] font-black uppercase mb-1">80 Puan Altı Kayıtlar</p>
                    <h2 id="kpiCritical" class="text-5xl font-black text-white">0</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 glass-card p-8 rounded-[2.5rem]">
                    <h3 class="font-bold text-slate-300 text-sm mb-6 flex items-center">📈 Performans Zaman Trendi</h3>
                    <canvas id="mainChart" height="120"></canvas>
                </div>
                <div class="glass-card p-8 rounded-[2.5rem]">
                    <h3 class="font-bold text-slate-300 mb-6 text-sm">🚫 Açıklama Odaklı Hata Analizi</h3>
                    <div id="errorAnalysis" class="space-y-4"></div>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem]">
                <h3 class="font-bold text-slate-300 mb-6 text-sm">👥 Gruplara Göre Puan Dağılımı</h3>
                <canvas id="teamChart" height="80"></canvas>
            </div>
        </div>
    </main>

    <script>
        let rawData = [], filteredData = [], charts = {}, activeFilters = { loc: null, team: null };

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const workbook = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
                const data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                // Veriyi olduğu gibi alıyoruz (Değiştirme/Maskeleme Yok)
                rawData = data.map(d => ({
                    ...d,
                    "Puan": parseFloat(d["Form Puan"]) || 0,
                    "Grup": d["Grup Adı"] || d["Lokasyon"] || "Belirtilmemiş",
                    "Takım": d["Takım Adı"] || d["Vardiya"] || "Belirtilmemiş"
                }));

                document.getElementById('dashboard').style.opacity = "1";
                document.getElementById('slicerSection').classList.remove('hidden');
                initSlicers();
                updateDashboard();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function initSlicers() {
            const locs = [...new Set(rawData.map(d => d["Grup"]))].sort();
            const teams = [...new Set(rawData.map(d => d["Takım"]))].sort();
            renderSlicer('locSlicer', locs, 'loc');
            renderSlicer('teamSlicer', teams, 'team');
        }

        function renderSlicer(id, items, key) {
            const el = document.getElementById(id);
            el.innerHTML = `<button class="slicer-btn px-2 py-1 text-[9px] font-bold border border-slate-800 rounded-lg bg-slate-900 active" onclick="setFilter('${key}', null)">HEPSİ</button>`;
            items.forEach(i => {
                el.innerHTML += `<button class="slicer-btn px-2 py-1 text-[9px] font-bold border border-slate-800 rounded-lg bg-slate-900" onclick="setFilter('${key}', '${i}')">${i}</button>`;
            });
        }

        window.setFilter = (key, val) => {
            activeFilters[key] = val;
            updateDashboard();
            const container = document.getElementById(key + 'Slicer');
            container.querySelectorAll('.slicer-btn').forEach(btn => {
                btn.classList.toggle('active', (val === null && btn.innerText === "HEPSİ") || btn.innerText === val);
            });
        };

        function updateDashboard() {
            filteredData = rawData.filter(d => 
                (!activeFilters.loc || d["Grup"] === activeFilters.loc) && 
                (!activeFilters.team || d["Takım"] === activeFilters.team)
            );
            
            const scores = filteredData.map(d => d.Puan);
            const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b, 0) / scores.length) : 0;
            const criticals = filteredData.filter(d => d.Puan < 80).length;

            document.getElementById('kpiScore').innerText = "%" + avg;
            document.getElementById('kpiTotal').innerText = filteredData.length;
            document.getElementById('kpiCritical').innerText = criticals;
            document.getElementById('statusInfo').innerText = `ESTEL ANALİZ: ${filteredData.length} Satır Veri İşlendi`;

            renderCharts();
            analyzeDescriptions();
        }

        function renderCharts() {
            // Trend Chart
            const tCtx = document.getElementById('mainChart').getContext('2d');
            if(charts.main) charts.main.destroy();
            const trendData = filteredData.slice(-15);
            
            charts.main = new Chart(tCtx, {
                type: 'line',
                data: {
                    labels: trendData.map(d => (d["Tarih"] || "").toString().slice(0, 10)),
                    datasets: [{
                        label: 'Puan',
                        data: trendData.map(d => d.Puan),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } }
            });

            // Group/Team Chart
            const bCtx = document.getElementById('teamChart').getContext('2d');
            if(charts.team) charts.team.destroy();
            const groups = {};
            filteredData.forEach(d => {
                if(!groups[d.Takım]) groups[d.Takım] = {s:0, c:0};
                groups[d.Takım].s += d.Puan; groups[d.Takım].c++;
            });

            charts.team = new Chart(bCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(groups),
                    datasets: [{
                        data: Object.values(groups).map(g => g.s/g.c),
                        backgroundColor: '#6366f1',
                        borderRadius: 8
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { max: 100 } } }
            });
        }

        function analyzeDescriptions() {
            const keywords = {"Bilgi Eksikliği": ["bilgi", "eksik", "hatalı"], "İletişim / Üslup": ["üslup", "nezaket", "senli"], "Süreç / Kayıt": ["not", "sistem", "prosedür"]};
            const counts = {};
            filteredData.forEach(d => {
                const desc = (d["Açıklama Detay"] || "").toLowerCase();
                for(let k in keywords) {
                    if(keywords[k].some(w => desc.includes(w))) counts[k] = (counts[k] || 0) + 1;
                }
            });

            document.getElementById('errorAnalysis').innerHTML = Object.entries(counts).map(([k, v]) => `
                <div class="flex justify-between p-4 bg-slate-900/50 rounded-2xl border border-slate-800">
                    <span class="text-xs font-bold text-slate-400">${k}</span>
                    <span class="text-xs font-black text-red-500">${v} Adet</span>
                </div>
            `).join('') || '<p class="text-xs text-slate-600 italic">Veri analizi için metin bulunamadı.</p>';
        }
    </script>
</body>
</html>

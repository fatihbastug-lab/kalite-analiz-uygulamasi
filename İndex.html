<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kalite Analiz Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-2xl mx-auto bg-white p-10 rounded-xl shadow-md mt-10">
        <h1 class="text-2xl font-bold mb-5 text-center text-blue-600">🛡️ Kalite Analiz Paneli</h1>
        <p class="text-center text-gray-500 mb-8">Lütfen analiz etmek istediğiniz Excel dosyasını seçin.</p>
        
        <div class="flex justify-center mb-10">
            <input type="file" id="fileInput" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div id="results" class="hidden">
            <div id="stats" class="grid grid-cols-2 gap-4 mb-5 text-center font-bold text-white">
                <div id="ok" class="bg-green-500 p-4 rounded-lg leading-tight">Uygun: 0</div>
                <div id="nok" class="bg-red-500 p-4 rounded-lg leading-tight">Hatalı: 0</div>
            </div>
            <div id="tableOutput" class="border rounded overflow-hidden text-xs"></div>
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                showData(json);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function showData(data) {
            document.getElementById('results').classList.remove('hidden');
            let ok = 0, nok = 0;
            
            data.forEach(row => {
                const val = Object.values(row).join(" ").toLowerCase();
                if(val.includes("uygun") && !val.includes("değil")) ok++;
                else if(val.includes("değil") || val.includes("hata")) nok++;
            });

            document.getElementById('ok').innerText = "Uygun: " + ok;
            document.getElementById('nok').innerText = "Hatalı: " + nok;
            
            let html = '<table class="w-full"><thead><tr class="bg-gray-200">';
            Object.keys(data[0]).forEach(k => html += `<th class="p-2 border">${k}</th>`);
            html += '</tr></thead><tbody>';
            data.slice(0, 10).forEach(r => { // İlk 10 satırı göster
                html += '<tr>';
                Object.values(r).forEach(v => html += `<td class="p-2 border text-center">${v}</td>`);
                html += '</tr>';
            });
            document.getElementById('tableOutput').innerHTML = html + '</tbody></table>';
        }
    </script>
</body>
</html>
